<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahad Rehman Durrani | AI Engineer</title>
  <meta name="description" content="Mahad Rehman Durrani — AI Engineer building Agentic AI systems, MLOps pipelines, and production-grade GenAI applications. Interactive Ubuntu desktop portfolio.">
  <meta name="author" content="Mahad Rehman Durrani">
  <meta name="theme-color" content="#1d1d1d">
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ubuntu.css">
</head>
<body>

  <!-- ====== BOOT SCREEN (3D Monitor) ====== -->
  <div id="boot-screen" class="boot-screen">
    <div class="desk-scene">
      <div class="monitor-assembly">
        <div class="monitor-body">
          <div class="monitor-bezel">
            <div class="monitor-screen" id="monitor-screen">
              <div class="screen-off-state" id="screen-off-state">
                <div class="screen-glare"></div>
              </div>
              <div class="screen-boot-state hidden" id="screen-boot-state">
                <div class="boot-logo">
                  <svg class="ubuntu-circle" viewBox="0 0 100 100" width="80" height="80">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="#E95420" stroke-width="6"/>
                    <circle cx="50" cy="5" r="8" fill="#E95420"/>
                    <circle cx="11" cy="72" r="8" fill="#E95420"/>
                    <circle cx="89" cy="72" r="8" fill="#E95420"/>
                  </svg>
                  <div class="boot-text">Ubuntu</div>
                </div>
                <div class="boot-dots">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
            </div>
            <div class="monitor-webcam"></div>
          </div>
          <div class="monitor-chin">
            <div class="monitor-logo">DELL</div>
            <!-- Power button on bottom-right of chin -->
            <div class="power-area">
              <button class="power-button" id="power-button" aria-label="Power on">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2v8"/>
                  <path d="M5.63 6.63a9 9 0 1 0 12.74 0"/>
                </svg>
              </button>
              <div class="boot-instruction" id="boot-instruction">← Click to power on</div>
            </div>
          </div>
        </div>
        <div class="monitor-stand-neck"></div>
        <div class="monitor-stand-base"></div>
      </div>

      <!-- Desk surface — monitor sits on this -->
      <div class="desk-surface">
        <div class="desk-reflection"></div>
      </div>
    </div>
  </div>

  <!-- ====== UBUNTU DESKTOP ====== -->
  <div id="ubuntu-desktop" class="ubuntu-desktop hidden">

    <!-- Top Panel -->
    <div class="top-panel" id="top-panel">
      <div class="top-panel-left">
        <button class="activities-btn" id="activities-btn">Activities</button>
      </div>
      <div class="top-panel-center">
        <button class="panel-clock-btn" id="panel-clock-btn">
          <span class="panel-clock" id="panel-clock"></span>
        </button>
        <!-- Calendar/Date dropdown -->
        <div class="calendar-dropdown" id="calendar-dropdown">
          <div class="calendar-header">
            <div class="calendar-month" id="calendar-month"></div>
          </div>
          <div class="calendar-grid" id="calendar-grid">
            <!-- Populated by JS -->
          </div>
          <div class="calendar-divider"></div>
          <div class="calendar-info">
            <div class="calendar-info-row">
              <span class="cal-label">🌡 Weather</span>
              <span class="cal-value">Islamabad — ☀️ 28°C</span>
            </div>
            <div class="calendar-info-row">
              <span class="cal-label">🔔 Notifications</span>
              <span class="cal-value">No new notifications</span>
            </div>
          </div>
        </div>
      </div>
      <div class="top-panel-right">
        <div class="system-tray">
          <span class="tray-icon" title="Network">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          </span>
          <span class="tray-icon" title="Volume">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </span>
          <span class="tray-icon" title="Battery">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </span>
          <span class="tray-user">Mahad</span>
        </div>
      </div>
    </div>

    <!-- Desktop Area -->
    <div class="desktop-area" id="desktop-area">

      <!-- Desktop Icons — centered grid layout -->
      <div class="desktop-icons" id="desktop-icons">
        <div class="desktop-icon" data-app="about" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><circle cx="24" cy="16" r="10" fill="#E95420"/><path d="M6 42c0-9.94 8.06-18 18-18s18 8.06 18 18" fill="#E95420" opacity="0.7"/></svg>
          </div>
          <span class="icon-label">About Me</span>
        </div>
        <div class="desktop-icon" data-app="experience" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><rect x="6" y="14" width="36" height="26" rx="3" fill="#E95420"/><path d="M16 14V10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v4" fill="none" stroke="#E95420" stroke-width="3"/><rect x="20" y="24" width="8" height="6" rx="1" fill="#2C001E"/></svg>
          </div>
          <span class="icon-label">Experience</span>
        </div>
        <div class="desktop-icon" data-app="projects" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><path d="M4 12h16l4-4h20a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V12z" fill="#E95420"/><rect x="4" y="16" width="40" height="24" rx="2" fill="#C34113"/></svg>
          </div>
          <span class="icon-label">Projects</span>
        </div>
        <div class="desktop-icon" data-app="skills" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><rect x="2" y="6" width="44" height="36" rx="4" fill="#300A24"/><text x="8" y="20" fill="#4E9A06" font-family="monospace" font-size="10">$ neofetch</text><text x="8" y="32" fill="#E95420" font-family="monospace" font-size="8">mahad@skills</text></svg>
          </div>
          <span class="icon-label">Terminal</span>
        </div>
        <div class="desktop-icon" data-app="certifications" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><rect x="6" y="2" width="36" height="44" rx="3" fill="#E95420"/><rect x="12" y="8" width="24" height="3" rx="1" fill="#2C001E"/><rect x="12" y="15" width="24" height="2" rx="1" fill="#2C001E" opacity="0.5"/><rect x="12" y="21" width="20" height="2" rx="1" fill="#2C001E" opacity="0.5"/><circle cx="24" cy="34" r="6" fill="#2C001E"/><path d="M24 28l1.76 3.56 3.93.57-2.85 2.77.67 3.93L24 36.9l-3.51 1.85.67-3.93-2.85-2.77 3.93-.57z" fill="#FFB626"/></svg>
          </div>
          <span class="icon-label">Certificates</span>
        </div>
        <div class="desktop-icon" data-app="contact" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><rect x="2" y="10" width="44" height="28" rx="4" fill="#E95420"/><path d="M2 14l22 14 22-14" fill="none" stroke="#2C001E" stroke-width="3"/></svg>
          </div>
          <span class="icon-label">Contact</span>
        </div>
        <div class="desktop-icon" data-app="resume" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><path d="M12 2h18l10 10v32a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="#E95420"/><path d="M30 2v10h10" fill="#C34113"/><rect x="14" y="18" width="20" height="2" rx="1" fill="#2C001E" opacity="0.6"/><rect x="14" y="24" width="16" height="2" rx="1" fill="#2C001E" opacity="0.6"/><rect x="14" y="30" width="20" height="2" rx="1" fill="#2C001E" opacity="0.6"/><rect x="14" y="36" width="12" height="2" rx="1" fill="#2C001E" opacity="0.6"/></svg>
          </div>
          <span class="icon-label">Resume</span>
        </div>
        <div class="desktop-icon" data-app="trash" tabindex="0">
          <div class="icon-image">
            <svg viewBox="0 0 48 48" width="48" height="48"><path d="M14 14h20v28a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V14z" fill="#77767B"/><rect x="10" y="10" width="28" height="4" rx="2" fill="#9A9996"/><rect x="20" y="4" width="8" height="6" rx="1" fill="none" stroke="#9A9996" stroke-width="2"/><line x1="20" y1="20" x2="20" y2="38" stroke="#5E5C64" stroke-width="2"/><line x1="24" y1="20" x2="24" y2="38" stroke="#5E5C64" stroke-width="2"/><line x1="28" y1="20" x2="28" y2="38" stroke="#5E5C64" stroke-width="2"/></svg>
          </div>
          <span class="icon-label">Trash</span>
        </div>
      </div>

      <!-- Windows Container -->
      <div class="windows-container" id="windows-container"></div>
    </div>

    <!-- Dock (Left side) — starts empty, populated dynamically by JS when apps open -->
    <div class="dock" id="dock">
      <div class="dock-empty-hint" id="dock-empty-hint">
        <span>No open apps</span>
      </div>
    </div>

  </div>

  <script src="js/ubuntu.js"></script>
</body>
</html>
